<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0b1a3a;overflow:hidden;touch-action:none;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:#fff;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;z-index:5}
#top{left:0;right:0;top:calc(env(safe-area-inset-top) + 4px);display:flex;justify-content:flex-start;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding:0 6vw;pointer-events:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}#top::-webkit-scrollbar{display:none}.chip{flex:0 0 auto}@media (orientation:landscape){#top{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 calc(env(safe-area-inset-right) + 110px) 0 calc(env(safe-area-inset-left) + 7vw);pointer-events:auto;scrollbar-width:none}#top::-webkit-scrollbar{display:none}.chip{flex:0 0 auto}}
.chip{pointer-events:auto;border:0;border-radius:14px;padding:5px 10px;font:700 12px system-ui,sans-serif;background:rgba(255,255,255,.16);color:#fff;touch-action:manipulation}
.chip.on{background:#ffd54a;color:#3a2000}
#side{right:calc(env(safe-area-inset-right) + 6px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;width:94px}
.btn{border:0;border-radius:10px;padding:7px 4px;font:800 12px system-ui,sans-serif;color:#fff;background:#2e7d4f;touch-action:manipulation;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.red{background:#c62828}.btn.blue{background:#1565c0}.btn.gray{background:#555}.btn.gold{background:#b8860b}
#tempoBox{font:700 10px system-ui;text-align:center;background:rgba(0,0,0,.35);border-radius:10px;padding:4px}
#tempo{width:86px}
#lyr{left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;max-width:92vw;display:none}
#lyr .t{font:700 11px system-ui;color:#ffd54a;margin-bottom:2px}
#lyr .l{font:700 clamp(15px,2.2vw + 6px,22px) Georgia,serif;background:rgba(0,0,0,.5);border-radius:10px;padding:4px 12px;line-height:1.25}
#lyr .w{color:rgba(255,255,255,.45)}#lyr .w.d{color:#fff}#lyr .w.a{color:#ffd54a;text-shadow:0 0 8px #ffb300}
#book{display:none;position:fixed;inset:0;z-index:20;background:rgba(5,10,30,.82);align-items:center;justify-content:center}
#book .p{background:#1d2b55;border:3px solid #ffd54a;border-radius:16px;padding:12px;width:min(92vw,420px);max-height:88vh;overflow:auto}
#book h3{margin:2px 0 8px;text-align:center;color:#ffe9a8;font-family:Georgia,serif}
#book button.s{display:block;width:100%;margin:5px 0;padding:10px;border:0;border-radius:10px;font:700 15px system-ui;background:#2b3f7a;color:#fff;text-align:left}
#book button.s.f{background:#8e1020}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#26124a,#0b1a3a);text-align:center}
#start h1{font-family:Georgia,serif;color:#ffe9a8;margin:0 10px 6px;font-size:clamp(22px,6vw,40px)}
#start p{margin:4px;opacity:.85}
#go{margin-top:14px;font:800 22px system-ui;padding:14px 34px;border-radius:30px;border:0;background:#ffd54a;color:#3a2000}
#err{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#b71c1c;color:#fff;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap}
@media (orientation:portrait){#side{top:auto;bottom:auto;transform:none;flex-direction:row;flex-wrap:wrap;width:auto;left:6px;right:6px;justify-content:center}#tempo{width:80px}}
